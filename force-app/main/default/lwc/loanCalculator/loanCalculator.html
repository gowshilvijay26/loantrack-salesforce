<template>
    <lightning-card title="Loan EMI Calculator" icon-name="standard:currency">
        <div class="slds-p-around_medium">

            <lightning-input
                type="number"
                label="Principal Amount"
                value={principal}
                onchange={handlePrincipalChange}
                step="0.01">
            </lightning-input>

            <lightning-input
                type="number"
                label="Annual Interest Rate (%)"
                value={rate}
                onchange={handleRateChange}
                step="0.01"
                class="slds-m-top_small">
            </lightning-input>

            <lightning-input
                type="number"
                label="Tenure (Months)"
                value={tenure}
                onchange={handleTenureChange}
                class="slds-m-top_small">
            </lightning-input>

            <lightning-button
                variant="brand"
                label="Calculate EMI"
                onclick={calculateEmi}
                class="slds-m-top_medium">
            </lightning-button>

            <template if:true={showResult}>
                <div class="slds-m-top_medium slds-box slds-theme_shade">
                    <p><b>Monthly EMI:</b> {emiFormatted}</p>
                    <p><b>Total Payable:</b> {totalPayableFormatted}</p>
                    <p><b>Total Interest:</b> {totalInterestFormatted}</p>
                </div>
            </template>

            <template if:true={showError}>
                <div class="slds-m-top_medium slds-text-color_error">
                    {errorMessage}
                </div>
            </template>

        </div>
    </lightning-card>
</template>
